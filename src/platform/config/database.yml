# Postgres é a fonte da verdade (07, P2; ADR-006).
# A conexão vem de DATABASE_URL (sem o nome do banco); o nome fica aqui por ambiente.
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch("DATABASE_URL", "postgres://helpdesk:helpdesk@localhost:5432") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: helpdesk_development

test:
  <<: *default
  database: helpdesk_test<%= ENV["TEST_ENV_NUMBER"] %>
  # Os testes de concorrência abrem até 8 threads, cada uma com a própria conexão (AGENTS.md, item 3).
  # Com o pool de 5, três esperavam por conexão e estouravam o tempo quando o lock demorava.
  max_connections: 10

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "helpdesk_production") %>
