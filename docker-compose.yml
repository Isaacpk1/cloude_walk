# Ambiente local do Help Desk CloudWalk (ADR-011, RNF-29).
# Bloco 02: postgres, redis, web e channels-mock. Os demais serviços entram nos blocos seguintes
# (worker e broker no 03, consumer e agent-mock no 04, scheduler no 08).
name: helpdesk

x-platform: &platform
  # Contexto src/: a imagem precisa da gem de contratos (src/contracts), além da plataforma.
  build:
    context: ./src
    dockerfile: platform/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-helpdesk}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Filas do Sidekiq, pub/sub do ActionCable e rate limit. Não é fonte da verdade (ADR-005).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *platform
    ports:
      - "3000:3000"
    volumes:
      - ./src/platform:/rails
      - ./src/contracts:/contracts
      - bundle:/usr/local/bundle
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 30
      # Na primeira subida (ou depois de trocar o Ruby) o entrypoint instala as gems no volume
      # `bundle` e roda o db:prepare: pode passar de 150 s. Falhas nesse período não contam.
      start_period: 600s

  # Provedores simulados e simulador do cliente (RF-04, ADR-012): http://localhost:4000
  channels-mock:
    build:
      context: ./src
      dockerfile: channels-mock/Dockerfile
    environment:
      PLATFORM_URL: http://web:3000              # de contêiner para contêiner
      PLATFORM_PUBLIC_URL: http://localhost:3000 # links abertos no navegador
    ports:
      - "4000:4000"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://localhost:4000/')).is_a?(Net::HTTPSuccess)"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  bundle:
