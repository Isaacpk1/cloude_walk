# Ambiente local do Help Desk CloudWalk (ADR-011, RNF-29).
# Bloco 01: postgres, redis e web. Os demais serviços entram nos blocos seguintes
# (worker e broker no 03, consumer e agent-mock no 04, channels-mock no 02, scheduler no 08).
name: helpdesk

x-platform: &platform
  build: ./src/platform
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-helpdesk}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Filas do Sidekiq, pub/sub do ActionCable e rate limit. Não é fonte da verdade (ADR-005).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    <<: *platform
    ports:
      - "3000:3000"
    volumes:
      - ./src/platform:/rails
      - bundle:/usr/local/bundle
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  bundle:
